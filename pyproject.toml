[project]
name = "flight-delay"
version = "0.1.0"
description = "Flight arrival delay prediction at scale: Delta Lake, Spark vs DuckDB, MLflow."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sergio Peigneux d'Egmont" }]

dependencies = [
    "duckdb>=1.1",
    "mlflow>=2.16",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# delta-spark 4.3.1 requires pyspark >=4.0.1,<=4.1.1. Pinning the upper bound
# here rather than discovering it from a resolver backtrack: pyspark 4.2 and
# delta-spark 4.3.1 cannot be installed together.
spark = [
    "pyspark>=4.0.1,<=4.1.1",
    "delta-spark>=4.0,<5",
]
api = [
    "fastapi>=0.115",
    # joblib persists the fitted pipeline; the API loads it rather than
    # refitting on startup.
    "joblib>=1.4",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]
ui = [
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    # Required by fastapi.testclient.
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
flight-delay = "flight_delay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_delay"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# scikit-learn's estimator API is defined with a capital `X`; renaming it would
# break duck-typing against every other transformer.
"src/flight_delay/models/train.py" = ["N803"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests"]

# `pyspark` is in an optional extra, so it may be absent locally while the
# Spark gate is still open. The override only applies when the module cannot be
# found: once pyspark is installed its bundled stubs are used normally.
[[tool.mypy.overrides]]
module = [
    "delta.*",
    "duckdb.*",
    "joblib.*",
    "mlflow.*",
    "pyspark.*",
    "sklearn.*",
    "streamlit.*",
]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "~/.cache/flight-delay/pytest"
addopts = "-q --strict-markers"
markers = [
    "spark: requires a running Spark session (slow, needs Java 17)",
    "data: requires the BTS data lake to be present",
]

[tool.coverage.run]
source = ["src/flight_delay"]
branch = true
